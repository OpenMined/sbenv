name: Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "cli/**"
      - "install.sh"
      - "README.md"
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump type
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      force_version:
        description: Force a specific version, for example 0.2.0
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Test and lint (${{ matrix.os }})
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        working-directory: cli
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: cli
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: cli
        run: cargo test --all-targets --all-features --locked

  bump-version:
    name: Bump version
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Bump Cargo version
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -n 1)"
          forced_version="${{ github.event.inputs.force_version }}"
          bump_type="${{ github.event.inputs.bump_type || 'patch' }}"

          if [[ -n "$forced_version" ]]; then
            new_version="$forced_version"
          else
            IFS='.' read -r major minor patch <<< "$current_version"
            case "$bump_type" in
              major) new_version="$((major + 1)).0.0" ;;
              minor) new_version="$major.$((minor + 1)).0" ;;
              patch) new_version="$major.$minor.$((patch + 1))" ;;
              *) echo "Unsupported bump_type: $bump_type" >&2; exit 1 ;;
            esac
          fi

          sed -i "s/^version = .*/version = \"$new_version\"/" cli/Cargo.toml
          cargo update --manifest-path cli/Cargo.toml --workspace

          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cli/Cargo.toml cli/Cargo.lock
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push

  build:
    name: Build ${{ matrix.target }}
    needs: bump-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: sbenv
            use_cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            binary: sbenv
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            binary: sbenv
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            binary: sbenv
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: sbenv
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: sbenv
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: sbenv.exe
            use_cross: false
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
            binary: sbenv.exe
            use_cross: false

    steps:
      - name: Checkout bumped main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}

      - name: Install cross
        if: ${{ matrix.use_cross }}
        uses: taiki-e/install-action@cross

      - name: Build with Cargo
        if: ${{ !matrix.use_cross }}
        working-directory: cli
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build with cross
        if: ${{ matrix.use_cross }}
        working-directory: cli
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Package Unix binary
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "cli/target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          tar -C dist -czf "sbenv-${{ matrix.target }}.tar.gz" "${{ matrix.binary }}"

      - name: Package Windows binary
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "cli/target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          Compress-Archive -Path "dist/${{ matrix.binary }}" -DestinationPath "sbenv-${{ matrix.target }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbenv-${{ matrix.target }}
          path: |
            sbenv-${{ matrix.target }}.tar.gz
            sbenv-${{ matrix.target }}.zip
          if-no-files-found: error

  publish-crate:
    name: Publish to crates.io
    needs: [bump-version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bumped main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify package
        working-directory: cli
        run: cargo publish --dry-run --locked

      - name: Publish
        working-directory: cli
        run: cargo publish --locked --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  github-release:
    name: Create GitHub release
    needs: [bump-version, build, publish-crate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bumped main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.bump-version.outputs.version }}"
          tag="v$version"

          git fetch --tags
          git tag "$tag"
          git push origin "$tag"

          mapfile -t assets < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)

          gh release create "$tag" "${assets[@]}" \
            --title "sbenv $tag" \
            --notes "Published sbenv $version to crates.io and attached cross-platform binaries."
